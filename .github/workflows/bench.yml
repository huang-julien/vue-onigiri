name: bench

on:
  pull_request:
    branches:
      - main

concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -fg corepack && corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - run: pnpm install

      - name: Payload sizes and client fixtures
        run: pnpm --filter vue-onigiri bench:size
      - name: SSR bench (vitest)
        run: pnpm --filter vue-onigiri bench:ssr
      - name: Build client pages
        run: pnpm --filter vue-onigiri bench:client:build
      - name: Client bench (tachometer, headless Chrome)
        run: pnpm --filter vue-onigiri bench:client
      - name: Render report
        if: always()
        run: pnpm --filter vue-onigiri bench:report
        env:
          BENCH_COMMIT: ${{ github.event.pull_request.head.sha }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: packages/core/bench/results/*.json

      # Forked PRs get a read-only token, so only same-repo PRs can comment.
      - name: Upsert PR comment
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- vue-onigiri-bench -->";
            const body = fs.readFileSync("packages/core/bench/results/report.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.startsWith(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
